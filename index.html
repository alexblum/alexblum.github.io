<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ivas Bücherregal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#332c22;
    --cream:#fff6e6;
    --cream-dark:#f3e6c9;
    --night-top:#16213f;
    --night-bot:#0b1226;
    --gold:#f6c667;
    --coral:#e8735c;
  }
  *{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #2a3c6c 0%, transparent 60%),
      linear-gradient(180deg, var(--night-top), var(--night-bot));
    font-family:'Nunito', 'Noto Color Emoji', sans-serif;
    color:var(--cream);
    padding:34px 18px 60px;
  }
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .star{animation:tw 3.2s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.3;}50%{opacity:1;}}
  .wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;}
  header{ text-align:center; margin-bottom:34px;}
  header h1{
    font-family:'Baloo 2','Noto Color Emoji',sans-serif;
    font-weight:800;
    font-size:clamp(30px,7vw,46px);
    margin:0 0 8px;
    letter-spacing:.5px;
  }
  header p{
    font-weight:700;
    font-size:clamp(14px,3.4vw,17px);
    color:#cbbfa0;
    margin:0;
  }
  .shelf{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
    gap:22px;
  }
  .bookcard{
    position:relative;
    border-radius:22px;
    overflow:hidden;
    text-decoration:none;
    color:inherit;
    background:var(--cream);
    box-shadow:0 18px 40px rgba(0,0,0,.45);
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex;
    flex-direction:column;
  }
  .bookcard:hover{transform:translateY(-5px) rotate(-.6deg); box-shadow:0 26px 52px rgba(0,0,0,.55);}
  .bookcard:active{transform:scale(.98);}
  .cover{
    height:190px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:0 14px;
    position:relative;
  }
  .cover svg{width:100%;height:auto;display:block;max-height:150px;}
  .spine{
    position:absolute;left:0;top:0;bottom:0;width:10px;
    background:linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.08));
  }
  .badge{
    position:absolute;top:12px;right:12px;
    font-weight:800;font-size:12px;
    background:var(--coral);color:#fff8ee;
    padding:4px 10px;border-radius:999px;
    box-shadow:0 4px 10px rgba(200,88,67,.4);
  }
  .body{
    padding:14px 18px 18px;
    background:var(--cream);
    color:var(--ink);
    flex:1;
    display:flex;flex-direction:column;gap:4px;
  }
  .body h2{
    font-family:'Baloo 2','Noto Color Emoji',sans-serif;
    font-weight:800;
    font-size:19px;
    line-height:1.25;
    margin:0;
  }
  .body .sub{font-weight:700;font-size:12.5px;color:#8a7a55;margin:0;}
  .body .meta{
    margin-top:auto;
    padding-top:10px;
    display:flex;gap:8px;flex-wrap:wrap;
  }
  .chip{
    font-weight:800;font-size:11.5px;
    background:rgba(246,198,103,.22);
    border:1px solid rgba(246,198,103,.55);
    color:#6f5a23;
    padding:3px 10px;border-radius:999px;
  }
  footer{
    text-align:center;margin-top:44px;
    font-weight:700;font-size:13px;color:#8d8266;
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="wrap">
  <header>
    <h1>📚 Ivas Bücherregal</h1>
    <p>Eine Geschichte nach der anderen – zum Vorlesen und Lesenüben</p>
  </header>
  <div class="shelf" id="shelf"></div>
  <footer>Mit ❤️ gebaut · Alex &amp; Iva</footer>
</div>

<script src="assets/books.js"></script>
<script>
/* Sternenhimmel */
(function(){
  const el = document.getElementById('stars');
  const n = 40;
  let html = '';
  for(let i=0;i<n;i++){
    const x = (i*137.508)%100;
    const y = (i*73.3)%100;
    const r = (i%3===0)?2:1.2;
    const d = (i%6)*0.5;
    html += `<circle class="star" cx="${x}%" cy="${y}%" r="${r}" fill="#fff3d0" style="animation-delay:${d}s"/>`;
  }
  el.innerHTML = `<svg width="100%" height="100%">${html}</svg>`;
})();

/* Mini-Cover pro Buch */
function miniCover(art, accent, palette){
  const bg = `url(#g)`;
  let scene = '';
  if(art==='moon'){
    scene = `
      <circle cx="60" cy="28" r="16" fill="${accent}"/>
      <circle cx="55" cy="24" r="2" fill="#e0b355" opacity=".6"/>
      <circle cx="64" cy="32" r="1.6" fill="#e0b355" opacity=".5"/>
      <path d="M0,52 Q30,40 60,50 T120,48 V64 H0 Z" fill="${palette[1]}"/>
      <ellipse cx="34" cy="52" rx="9" ry="8" fill="#c9793f"/>
      <circle cx="37" cy="50" r="1.4" fill="#2b2a28"/>`;
  } else if(art==='dog'){
    scene = `
      <ellipse cx="60" cy="46" rx="26" ry="13" fill="#1a1512"/>
      <path d="M36,34 q-8,-2 -7,-13" stroke="#1a1512" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="80" cy="30" r="11" fill="#1a1512"/>
      <ellipse cx="85" cy="33" rx="6" ry="4.5" fill="#f3e2c0"/>
      <circle cx="89" cy="31" r="1.8" fill="#100c0a"/>
      <circle cx="77" cy="27" r="1.8" fill="#fff6e6"/>
      <ellipse cx="90" cy="38" rx="4.5" ry="10" fill="#100c0a" transform="rotate(-10 90 38)"/>`;
  } else {
    scene = `
      <rect x="38" y="20" width="44" height="40" rx="5" fill="${accent}"/>
      <rect x="42" y="20" width="6" height="40" fill="rgba(0,0,0,.18)"/>
      <rect x="54" y="30" width="24" height="4" rx="2" fill="rgba(255,255,255,.7)"/>
      <rect x="54" y="40" width="20" height="4" rx="2" fill="rgba(255,255,255,.5)"/>
      <rect x="54" y="50" width="24" height="4" rx="2" fill="rgba(255,255,255,.35)"/>`;
  }
  return `<svg viewBox="0 0 120 64" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${palette[0]}"/><stop offset="100%" stop-color="${palette[1]}"/>
    </linearGradient></defs>
    <rect width="120" height="64" fill="url(#g)"/>
    ${scene}
  </svg>`;
}

(function(){
  const shelf = document.getElementById('shelf');
  const books = window.BOOKS || [];
  shelf.innerHTML = books.map(b=>`
    <a class="bookcard" href="books/${b.slug}/index.html">
      ${b.isNew ? '<div class="badge">bald</div>' : ''}
      <div class="cover" style="background:linear-gradient(180deg, ${b.palette[0]}, ${b.palette[1]})">
        <div class="spine"></div>
        ${miniCover(b.art, b.accent, b.palette)}
      </div>
      <div class="body">
        <h2>${b.emoji} ${b.title}</h2>
        <p class="sub">${b.subtitle}</p>
        <div class="meta">
          ${b.chapters ? `<span class="chip">${b.chapters} Kapitel</span>` : ''}
          ${b.pages ? `<span class="chip">${b.pages} Seiten</span>` : ''}
          <span class="chip">${b.author}</span>
        </div>
      </div>
    </a>
  `).join('');
})();
</script>
</body>
</html>
